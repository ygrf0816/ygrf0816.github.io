<footer class="site-footer">
  <div class="wrap-wide">
    <div class="footer-inner">
      <p class="footer-brand">
        <strong>{{ site.title | escape }}</strong>
        <span class="footer-desc">{{ site.description | strip | truncate: 60 }}</span>
      </p>
      <p class="footer-links">
        <a href="{{ "/feed.xml" | relative_url }}" aria-label="RSS 订阅">RSS</a>
        <a href="https://github.com/{{ site.github_username }}" aria-label="GitHub 主页" target="_blank" rel="noopener">GitHub</a>
        {%- if site.twitter_username -%}
          <a href="https://twitter.com/{{ site.twitter_username }}" aria-label="Twitter / X" target="_blank" rel="noopener">X / Twitter</a>
        {%- endif -%}
      </p>
      <p class="footer-meta">
        © {{ "now" | date: "%Y" }} {{ site.title | escape }} · 保留所有权利 ·
        <span class="footer-built">由 <a href="https://jekyllrb.com/" target="_blank" rel="noopener">Jekyll</a> 构建</span>
      </p>
    </div>
  </div>
</footer>
