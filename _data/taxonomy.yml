  desc: 深度学习、生成模型、PINN、LLM/VLM、域适应与数据驱动的逆向设计。

- name: 光学仿真
  slug: optical-simulation
  color: "#475569"
  short: 仿真
  desc: LightTools、FDTD/RCWA、传输矩阵等仿真工具与建模方法。

- name: 光学设计
  slug: optical-design
  color: "#0e7490"
  short: 光学设计
  desc: 光学系统、膜系、滤光片与镜头的指标分解与方案设计。

- name: 光伏与能源器件
  slug: photovoltaics-energy
  color: "#a16207"
