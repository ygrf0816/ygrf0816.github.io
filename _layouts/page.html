---
layout: default
---
<article class="page">
  <header class="post-header">
    {%- capture display_title -%}{% include post-title.html title=page.title %}{%- endcapture -%}
    <h1 class="post-title">{{ display_title | escape }}</h1>
    {%- if page.summary -%}<p class="post-summary">{{ page.summary | strip_html }}</p>{%- endif -%}
  </header>
  <div class="post-content">
    {{ content }}
  </div>
</article>
